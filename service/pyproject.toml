[project]
name = "aipg-default-backend"
version = "3.0.3-beta"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  "apiflask",
  "marshmallow-dataclass",
  "psutil",
  "Requests",
  # urllib3 2.8.0: clears GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77 and
  # GHSA-gh4c-6fx4-qh6g. Transitive via Requests (urllib3<3).
  "urllib3>=2.8.0",
  "setuptools>=83.0.0",
  "huggingface_hub",
]
[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
         { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
         { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
              { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
              { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
               { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
               { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
pytorch-triton-xpu = [
  { index = "pytorch-xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]



[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
