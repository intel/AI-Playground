[project]
name = "aipg-default-backend"
version = "3.0.3-beta"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  # werkzeug 3.1.9: clears CVE-2026-102598. Transitive via Flask / apiflask.
  "werkzeug>=3.1.9",
  "apiflask",
  "marshmallow-dataclass",
  "psutil",
  "Requests",
  # urllib3 2.8.0: clears GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77 and
  # GHSA-gh4c-6fx4-qh6g. Transitive via Requests (urllib3<3).
  "urllib3>=2.8.0",
  # certifi 2026.10.19: clears GHSA-6q48-6c7w-9gw2 (emSign roots with compromised
  # intermediate CA keys). Transitive via Requests / huggingface_hub.
  "certifi>=2026.10.19",
  # filelock 4.2.1: clears GHSA-v4x8-3wr5-3wq8, GHSA-9vhv-jxww-xfm5 and
  # GHSA-567q-5qvw-pf92. Transitive via huggingface_hub.
  "filelock>=4.2.1",
  # setuptools 84.1.0: clears GHSA-xmj3-9gf7-h52w (path escape via
  # namespace_packages.txt in legacy wheel installs).
  "setuptools>=84.1.0",
  "huggingface_hub",
]
[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
         { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
         { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
              { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
              { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
               { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
               { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
pytorch-triton-xpu = [
  { index = "pytorch-xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]



[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
