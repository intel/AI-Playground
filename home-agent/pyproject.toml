[project]
name = "aipg-home-agent"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  # werkzeug 3.1.9: clears CVE-2026-102598. Transitive via Flask.
  "werkzeug>=3.1.9",
  "flask-cors",
  "Requests",
  # urllib3 2.8.0: clears GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77 and
  # GHSA-gh4c-6fx4-qh6g. Transitive via Requests (urllib3<3).
  "urllib3>=2.8.0",
  "python-telegram-bot",
  "slack-bolt",
  "aiohttp",
  # multidict 6.9.1: clears CVE-2026-104874. Transitive via aiohttp.
  "multidict>=6.9.1",
  "av",
]
[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
