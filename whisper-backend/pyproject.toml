[project]
name = "aipg-whisper"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  "flask-cors",
  "soundfile",
  "numpy",
  "librosa",
  # transformers 5 for the Whisper automatic-speech-recognition pipeline. Pinned to
  # the same floor as the qwen3-tts sidecar (4.x carries CVE-2026-4372, an RCE from a
  # crafted config.json, fixed only in 5.x).
  "transformers>=5.14.0,<6",
  "accelerate>=1.12.0",
  "huggingface_hub",
]

# torch ships from a different index per accelerator, so it lives in mutually
# exclusive extras (mirrors qwen3-tts / comfyui-deps). The Electron service installs
# exactly one: 'cuda' in NVIDIA product mode, 'xpu' on Windows, 'cpu' elsewhere.
[project.optional-dependencies]
xpu = [
  "torch>=2.13.0",
  "triton-xpu>=3.6.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
cuda = [
  "torch>=2.13.0",
]
cpu = [
  "torch>=2.13.0",
]

[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
conflicts = [
  [
    { extra = "xpu" },
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "xpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", extra = "cuda", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu" },
]
triton-xpu = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
