[project]
name = "aipg-whisper"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  # werkzeug 3.1.9: clears CVE-2026-102598. Transitive via Flask.
  "werkzeug>=3.1.9",
  "flask-cors",
  "soundfile",
  "numpy",
  "librosa",
  # transformers 5 for the Whisper automatic-speech-recognition pipeline. Pinned to
  # the same floor as the qwen3-tts sidecar (4.x carries CVE-2026-4372, an RCE from a
  # crafted config.json, fixed only in 5.x).
  "transformers>=5.14.0,<6",
  "accelerate>=1.12.0",
  "huggingface_hub",
  # urllib3 2.8.0: clears GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77 and
  # GHSA-gh4c-6fx4-qh6g. Transitive via huggingface_hub / requests (urllib3<3).
  "urllib3>=2.8.0",
  # certifi 2026.10.19: clears GHSA-6q48-6c7w-9gw2 (emSign roots with compromised
  # intermediate CA keys). Transitive via requests / huggingface_hub.
  "certifi>=2026.10.19",
  # filelock 4.2.1: clears GHSA-v4x8-3wr5-3wq8, GHSA-9vhv-jxww-xfm5 and
  # GHSA-567q-5qvw-pf92. Transitive via torch / huggingface_hub / transformers.
  "filelock>=4.2.1",
  # setuptools 84.1.0: clears GHSA-xmj3-9gf7-h52w (path escape via
  # namespace_packages.txt in legacy wheel installs).
  "setuptools>=84.1.0",
]

# torch ships from a different index per accelerator, so it lives in mutually
# exclusive extras (mirrors qwen3-tts / comfyui-deps). The Electron service installs
# exactly one: 'cuda' in NVIDIA product mode, 'xpu' on Windows, 'cpu' elsewhere.
[project.optional-dependencies]
xpu = [
  "torch>=2.13.0",
  "triton-xpu>=3.6.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
cuda = [
  "torch>=2.13.0",
]
cpu = [
  "torch>=2.13.0",
]

[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
conflicts = [
  [
    { extra = "xpu" },
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "xpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", extra = "cuda", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu" },
]
triton-xpu = [
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
